name: Publicar artefato Maven

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar fontes
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android
        run: sdkmanager 'platforms;android-36'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validar e publicar no staging Maven
        run: ./gradlew :lib:assembleRelease :lib:publishReleasePublicationToNfeupRepository

      - name: Publicar repositório Maven no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: lib/build/maven-repository
          keep_files: true
          enable_jekyll: false
