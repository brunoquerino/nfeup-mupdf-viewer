apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

group = 'br.com.nfeup.libs'
version = '1.26.10a-nfeup.1'

dependencies {
	implementation 'androidx.appcompat:appcompat:1.1.0'
	api 'com.artifex.mupdf:fitz:1.27.1'
}

android {
	namespace 'com.artifex.mupdf.viewer'
    defaultConfig {
		minSdkVersion 21
		targetSdkVersion 36
		compileSdkVersion = 36
    }

	publishing {
		singleVariant("release") {
			withSourcesJar()
		}
	}
}

project.afterEvaluate {
	publishing {
		publications {
			release(MavenPublication) {
				groupId = project.group
				artifactId = 'mupdf-viewer'
				version = project.version
				from components.release

				pom {
					name = 'NFeUp MuPDF Viewer'
					url = 'https://github.com/brunoquerino/nfeup-mupdf-viewer'
					description = 'MuPDF Android Viewer com extensoes de renderizacao, texto e codigo de barras usadas pelo NFe Visualizador.'
					licenses {
						license {
							name = 'GNU Affero General Public License'
							url = 'https://www.gnu.org/licenses/agpl-3.0.html'
						}
					}
				}
			}
		}
		repositories {
			maven {
				name = 'Nfeup'
				url = layout.buildDirectory.dir('maven-repository')
			}
		}
	}
}
